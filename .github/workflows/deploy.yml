name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare dashboard
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-site"
          if [ -f index.zip ]; then
            unzip -o index.zip -d "$RUNNER_TEMP/dashboard-site"
            (cd "$RUNNER_TEMP/dashboard-site" && sha256sum -c index.sha256)
            rm "$RUNNER_TEMP/dashboard-site/index.sha256"
          else
            cp index.html "$RUNNER_TEMP/dashboard-site/index.html"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '${{ runner.temp }}/dashboard-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
